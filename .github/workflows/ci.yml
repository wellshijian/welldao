name: Windows 构建检查
on:
  push:
    branches: [ main ]
  pull_request:
permissions:
  contents: read
jobs:
  build-check:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: 构建并验证打包
        shell: pwsh
        run: |
          $compiler = ./scripts/get-nsis.ps1 -Directory $env:RUNNER_TEMP
          ./scripts/package_well.ps1 -NsisCompiler $compiler
